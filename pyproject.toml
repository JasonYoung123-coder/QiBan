[project]
name = "qiban-companion-core"
version = "0.2.0"
description = "Local-first companion API and optional LiveKit voice worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "livekit-api>=1.0,<2"
]

[project.optional-dependencies]
voice = ["livekit-agents[openai,silero]>=1.5,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
